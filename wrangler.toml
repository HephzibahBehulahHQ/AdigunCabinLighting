name = "adiguncabinlighting-account-preview"
main = "cloudflare/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = true
preview_urls = false

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/account", "/api/bot"]

[vars]
SUPABASE_URL = "https://fqcbfnktdvqojyezxeis.supabase.co"
PRODUCT_ACCOUNT_PREFIX = "adiguncabinlighting_preview"

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "63"
simple = { limit = 10, period = 60 }

[ai]
binding = "AI"

[[ratelimits]]
name = "BOT_LIMITER"
namespace_id = "65"
simple = { limit = 20, period = 60 }

[env.production]
name = "adiguncabinlighting-product"
workers_dev = false
preview_urls = false
routes = [{ pattern = "adiguncabinlighting.hephzibahbehulah.com/*", zone_name = "hephzibahbehulah.com" }]

[env.production.assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/account", "/api/bot"]

[env.production.vars]
SUPABASE_URL = "https://fqcbfnktdvqojyezxeis.supabase.co"
PRODUCT_ACCOUNT_PREFIX = "adiguncabinlighting"

[[env.production.ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "64"
simple = { limit = 10, period = 60 }

[env.production.ai]
binding = "AI"

[[env.production.ratelimits]]
name = "BOT_LIMITER"
namespace_id = "66"
simple = { limit = 20, period = 60 }
