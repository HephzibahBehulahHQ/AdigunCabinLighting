name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify checkout root and npm lockfile
        run: |
          pwd
          ls -la
          node -e "const fs = require('node:fs'); const lock = 'package-lock.json'; const exists = fs.existsSync(lock); const version = exists ? require('./package-lock.json').lockfileVersion : null; console.log(JSON.stringify({ cwd: process.cwd(), lockfileExists: exists, lockfileVersion: version })); if (!exists || version < 1) process.exit(1);"
      - run: npm ci
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Inspect static release for gateway code and credentials
        run: node scripts/check-static-release.mjs dist
      - name: Test static release inspection
        run: node --test scripts/check-static-release.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Print Playwright failure contexts
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test-results/*/error-context.md)
          for file in "${files[@]}"; do
            echo "::group::Playwright context: ${file}"
            cat "$file"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabin-lighting-ui-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore

